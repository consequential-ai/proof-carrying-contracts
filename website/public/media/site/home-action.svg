<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Check before execution</title><desc id="desc">Agent B submits an action and proof. A check uses the contract and current state. Acceptance permits the tool call; without an accepted proof, no tool call occurs.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#4e6472" stroke-width="1.5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#37645d" stroke-width="1.5"/></marker></defs><rect x="8" y="128" width="122" height="46" rx="23" stroke="#4e6472" stroke-width="1.6" fill="#edf2ef"/><text x="69.0" y="159" text-anchor="middle" fill="#4e6472" font-size="24" font-weight="500"><tspan x="69.0" dy="0">Agent B</tspan></text><rect x="179" y="126" width="126" height="58" rx="6" stroke="#4e6472" stroke-width="1.6" fill="#edf2ef"/><text x="242" y="164" text-anchor="middle" fill="#4e6472" font-size="26" font-weight="500"><tspan x="242" dy="0">Check</tspan></text><rect x="126" y="16" width="232" height="55" rx="6" stroke="#cbd1cd" stroke-width="1.6" fill="#faf9f6"/><text x="242" y="51" text-anchor="middle" fill="#242820" font-size="24" font-weight="400"><tspan x="242" dy="0">Contract + state</tspan></text><path d="M242 71V126" fill="none" stroke="#4e6472" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/><path d="M130 155H179" fill="none" stroke="#4e6472" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/><text x="125" y="105" text-anchor="middle" fill="#242820" font-size="24" font-weight="400"><tspan x="125" dy="0">Action + proof</tspan></text><path d="M305 155H453V221" fill="none" stroke="#37645d" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow-teal)"/><text x="382" y="193" text-anchor="middle" fill="#37645d" font-size="24" font-weight="400"><tspan x="382" dy="0">Accepted</tspan></text><rect x="352" y="222" width="115" height="56" rx="6" stroke="#37645d" stroke-width="1.6" fill="#edf2ef"/><text x="409" y="258" text-anchor="middle" fill="#37645d" font-size="26" font-weight="500"><tspan x="409" dy="0">Tool</tspan></text><path d="M242 184V228H164V262" fill="none" stroke="#4e6472" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/><text x="158" y="294" text-anchor="middle" fill="#4e6472" font-size="24" font-weight="400"><tspan x="158" dy="0">No accepted proof</tspan></text><path d="M73 313H243" fill="none" stroke="#4e6472" stroke-width="2" stroke-linejoin="round"  /><text x="158" y="343" text-anchor="middle" fill="#4e6472" font-size="24" font-weight="400"><tspan x="158" dy="0">No tool call</tspan></text></svg>