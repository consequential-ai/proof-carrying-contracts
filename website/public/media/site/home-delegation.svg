<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Delegate within the agreement</title><desc id="desc">Agent B carries out the main task under a parent contract. A delegation check precedes assigning a subtask and subcontract to Agent C, with the parent limits preserved.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#4e6472" stroke-width="1.5"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#37645d" stroke-width="1.5"/></marker></defs><rect x="12" y="8" width="456" height="100" rx="6" stroke="#cbd1cd" stroke-width="1.6" fill="#faf9f6"/><text x="32" y="38" text-anchor="start" fill="#4e6472" font-size="24" font-weight="500"><tspan x="32" dy="0">Main task</tspan></text><rect x="30" y="50" width="132" height="46" rx="23" stroke="#4e6472" stroke-width="1.6" fill="#edf2ef"/><text x="96.0" y="81" text-anchor="middle" fill="#4e6472" font-size="24" font-weight="500"><tspan x="96.0" dy="0">Agent B</tspan></text><path d="M193 48H430L448 66V97H193Z M430 48V66H448" stroke="#4e6472" stroke-width="1.6" fill="#faf9f6"/><text x="320" y="82" text-anchor="middle" fill="#242820" font-size="24" font-weight="400"><tspan x="320" dy="0">Parent contract</tspan></text><path d="M240 108V135" fill="none" stroke="#4e6472" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow-slate)"/><rect x="106" y="136" width="268" height="51" rx="6" stroke="#4e6472" stroke-width="1.6" fill="#edf2ef"/><text x="240" y="170" text-anchor="middle" fill="#4e6472" font-size="25" font-weight="500"><tspan x="240" dy="0">Delegation check</tspan></text><path d="M240 187V222" fill="none" stroke="#37645d" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow-teal)"/><rect x="30" y="223" width="420" height="99" rx="6" stroke="#37645d" stroke-width="1.6" fill="#faf9f6"/><text x="50" y="253" text-anchor="start" fill="#37645d" font-size="24" font-weight="500"><tspan x="50" dy="0">Subtask</tspan></text><rect x="48" y="266" width="128" height="46" rx="23" stroke="#4e6472" stroke-width="1.6" fill="#edf2ef"/><text x="112.0" y="297" text-anchor="middle" fill="#4e6472" font-size="24" font-weight="500"><tspan x="112.0" dy="0">Agent C</tspan></text><path d="M208 264H413L431 282V313H208Z M413 264V282H431" stroke="#4e6472" stroke-width="1.6" fill="#faf9f6"/><text x="319" y="297" text-anchor="middle" fill="#242820" font-size="24" font-weight="400"><tspan x="319" dy="0">Subcontract</tspan></text><text x="240" y="350" text-anchor="middle" fill="#37645d" font-size="24" font-weight="400"><tspan x="240" dy="0">Parent limits apply</tspan></text></svg>